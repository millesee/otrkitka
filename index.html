  <title>Для моей принцессы 💗</title>

  <style>
    :root {
      --pink-50:  #fff5f9;
      --pink-100: #ffe4ef;
      --pink-200: #ffc9de;
      --pink-300: #ff9fc5;
      --pink-400: #ff7eb6;
      --pink-500: #ff5c9e;
      --purple:   #b4267a;
      --ink:      #5c1a3e;
      --shadow:   0 10px 30px rgba(180, 38, 122, 0.18);

      --env-w: 300px;
      --env-h: 190px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      background:
        radial-gradient(circle at 20% 0%, #ffe4ef 0%, transparent 55%),
        radial-gradient(circle at 100% 100%, #ffc9de 0%, transparent 55%),
        linear-gradient(160deg, var(--pink-50), #ffe9f3 60%, #ffd6e8);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      gap: 16px;
      overflow-x: hidden;
    }

    .hearts {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .hearts span {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% { transform: translateY(-110vh) translateX(30px) rotate(360deg); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 156, 197, 0.5);
      border-radius: 28px;
      padding: 26px 20px 22px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 6px;
      color: var(--purple);
      letter-spacing: 0.3px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #a35a86;
      margin: 0 0 24px;
      line-height: 1.5;
      transition: color 0.3s;
    }
    .subtitle.locked {
      color: #d06a96;
      font-weight: 600;
    }

    .scene {
      position: relative;
      width: var(--env-w);
      height: var(--env-h);
      margin: 0 auto 20px;
      perspective: 1200px;
      transition: opacity 0.3s;
    }
    .scene.locked .envelope {
      pointer-events: none;
      filter: grayscale(40%) opacity(0.8);
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(10px);
      width: calc(var(--env-w) - 40px);
      min-height: 120px;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255, 228, 239, 0.35) 0px,
          rgba(255, 228, 239, 0.35) 1px,
          transparent 1px,
          transparent 28px
        ),
        #fff;
      border: 1px solid var(--pink-200);
      border-radius: 12px;
      padding: 16px 14px;
      box-shadow: 0 10px 25px rgba(180, 38, 122, 0.15);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--purple);
      line-height: 1.45;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: transform .6s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
    }

    .scene.open .letter {
      opacity: 1;
      transform: translateX(-50%) translateY(calc(-1 * var(--env-h) + 60px)) rotate(-1.5deg);
    }

    .envelope {
      position: absolute;
      inset: 0;
      cursor: pointer;
    }

    .env-body {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(160deg, #ffd9e8 0%, #ffb8d4 100%);
      border: 1px solid #ffa7c8;
      overflow: hidden;
      z-index: 2;
      filter: drop-shadow(0 12px 22px rgba(180, 38, 122, 0.2));
    }
    
    .env-body::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0; height: 30px;
      background: linear-gradient(180deg, rgba(180,38,122,.2) 0%, transparent 100%);
      pointer-events: none;
    }

    .env-body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.3) 50%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(255,255,255,0.3) 50%, transparent 52%);
      pointer-events: none;
    }

    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 130px;
      background: linear-gradient(160deg, #ffc9de 0%, #ff9fc5 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform .55s cubic-bezier(.22,.9,.3,1.05);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      z-index: 4;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      filter: drop-shadow(0 4px 10px rgba(180, 38, 122, 0.1));
    }

    .env-flap .seal {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff5c9e, #b4267a);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(180, 38, 122, 0.45), inset 0 -2px 6px rgba(0,0,0,0.15);
      transform: translateY(60px);
      transition: opacity .25s ease, transform .25s ease;
    }

    .scene.open .env-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .scene.open .env-flap .seal {
      opacity: 0;
      transform: translateY(60px) scale(.5);
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--pink-400), var(--purple));
      box-shadow: 0 8px 20px rgba(180, 38, 122, 0.35);
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s, background 0.3s;
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    button:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(180, 38, 122, 0.3);
    }
    button:disabled {
      background: linear-gradient(135deg, #d0b6c4, #9a7088);
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.8;
    }

    .hint {
      font-size: 0.72rem;
      color: #b8809f;
      margin-top: 14px;
      line-height: 1.4;
      transition: opacity 0.3s;
    }

    @media (max-width: 380px) {
      :root { --env-w: 270px; --env-h: 170px; }
      .env-flap { height: 110px; }
      .letter { font-size: 0.98rem; padding: 12px 10px; }
      .env-flap .seal { transform: translateY(50px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hearts span { animation: none; display: none; }
      .letter, .env-flap { transition: none; }
      button { transition: none; }
    }

  </main>

    function playPaperSound() {
      if (!audioCtx) return;
      const duration = 0.3;
      const bufferSize = audioCtx.sampleRate * duration;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < bufferSize; i++) {

      }
      
      const noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = buffer;
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000;
      filter.Q.value = 1.5;
      
      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      
      noiseNode.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      noiseNode.start();
    }

    function playChimeSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99];

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        const startTime = audioCtx.currentTime + (index * 0.08);
        
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 1.2);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(startTime);
        osc.stop(startTime + 1.2);
      });
    }

    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const scene    = document.getElementById("scene");
    const letterEl = document.getElementById("letter");
    const envBody  = document.getElementById("envBody");
    const envFlap  = document.getElementById("envFlap");
    const genBtn   = document.getElementById("genBtn");
    const subtitle = document.getElementById("subtitle");

    const STORAGE_DATE = "love_letter_date";
    const STORAGE_COUNT = "love_letter_count";

    function getMoscowDate() {
      const now = new Date();
      const mskTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3 * 3600000));
      return mskTime.toISOString().split('T')[0];
    }

    function getMoscowHour() {
      const now = new Date();
      const mskTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3 * 3600000));
      return mskTime.getHours();
    }

    function checkLimit() {
      const today = getMoscowDate();
      const hour = getMoscowHour();
      
      let savedDate = localStorage.getItem(STORAGE_DATE);
      let savedCount = parseInt(localStorage.getItem(STORAGE_COUNT) || "0", 10);

      if (savedDate !== today) {
        savedDate = today;
        savedCount = 0;
        localStorage.setItem(STORAGE_DATE, savedDate);
        localStorage.setItem(STORAGE_COUNT, savedCount);
      }

      if (hour >= 8 && hour < 23) {
        if (savedCount >= 1) {
          return { allowed: false, msg: "Утреннее письмо уже получено. Возвращайся за вторым после 23:00 💤" };
        }
        return { allowed: true, count: savedCount };
      } else {
        if (savedCount >= 2) {
          return { allowed: false, msg: "На сегодня лимит исчерпан, моя принцесса. Жду тебя завтра после 8:00 🌅" };
        }
        return { allowed: true, count: savedCount };
      }
    }

    function updateUI() {
      const status = checkLimit();
      
      if (!status.allowed) {
        genBtn.disabled = true;
        genBtn.textContent = "Письмо уже получено";
        subtitle.textContent = status.msg;
        subtitle.classList.add("locked");
        scene.classList.add("locked");
        scene.classList.remove("open");
      } else {
        genBtn.disabled = false;
        genBtn.textContent = "Получить письмо";
        subtitle.textContent = "Нажми на кнопку — конверт откроется, и письмо само тебя найдёт";
        subtitle.classList.remove("locked");
        scene.classList.remove("locked");
      }
    }

    let current = "";
    let busy = false;

    function pickLine() {
      let raw = pick(LINES);
      let guard = 0;
      while (raw === current && guard++ < 10) raw = pick(LINES);
      current = raw;
      return raw;
    }

    function receiveLetter() {
      if (busy) return;
      
      initAudio();

      const status = checkLimit();
      if (!status.allowed) {
        updateUI();
        return;
      }

      busy = true;
      const newCount = status.count + 1;
      localStorage.setItem(STORAGE_COUNT, newCount);

      if (scene.classList.contains("open")) {
        scene.classList.remove("open");
        setTimeout(() => {
          letterEl.textContent = pickLine();
          scene.classList.add("open");
          
          playPaperSound();
          setTimeout(playChimeSound, 400);

          busy = false;
          updateUI();
        }, 400);
      } else {
        letterEl.textContent = pickLine();
        setTimeout(() => {
          scene.classList.add("open");
          
          playPaperSound();
          setTimeout(playChimeSound, 400);

          busy = false;
          updateUI();
        }, 60);
      }
    }

    genBtn.addEventListener("click", receiveLetter);

    const toggleEnvelope = () => {
      if (!checkLimit().allowed) return;
      
      if (scene.classList.contains("open")) {
        scene.classList.remove("open");
      } else {
        receiveLetter();
      }
    };

    envBody.addEventListener("click", toggleEnvelope);
    envFlap.addEventListener("click", toggleEnvelope);

    setInterval(updateUI, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") updateUI();
    });
